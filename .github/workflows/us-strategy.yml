name: Daily US Strategy

on:
  schedule:
    # 台灣時間每天 05:00 = UTC 21:00（前一日）
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: us-strategy-daily
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run US_Strategy.py
        run: python US_Strategy.py

      - name: Commit US_Strategy.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add US_Strategy.json
          if git diff --staged --quiet; then
            echo "JSON 無變更，略過 commit"
          else
            git commit -m "chore: 更新台灣時間當日美股策略選股"
            git push
          fi

      - name: Prepare GitHub Pages files
        run: |
          mkdir -p _site
          cp index.html US_Strategy.json _site/
          cp .nojekyll _site/.nojekyll

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

  pages:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
